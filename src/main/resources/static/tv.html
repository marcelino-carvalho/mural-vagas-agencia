<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Painel de Vagas - Agencia</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a66d1">
  <link rel="apple-touch-icon" href="/logo-agencia-2026.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <link rel="stylesheet" href="/css/tv.css">
</head>
<body>

<header id="header-principal">
  <div class="logo-area">
    <img src="/logo-agencia-2026.png" alt="Logo" onerror="this.style.display='none'">
  </div>
  <h1 id="titulo-categoria">CARREGANDO...</h1>
  <!-- relogio removido -->
</header>

<div class="container" id="lista-vagas"></div>
<footer class="rodape">
  <div class="rodape-aviso">
    <span class="aviso-titulo">ATENÇÃO!</span>
    <span class="aviso-texto">NÃO tocar na tela da TV</span>
  </div>
  <div class="rodape-centro">
    <div class="rodape-texto">
      <p class="rodape-titulo">ACESSE JÁ O NOSSO MURAL INTERATIVO!</p>
      <div class="rodape-sub">Escaneie o Qr Code pelo seu celular e veja detalhes das vagas</div>
    </div>
    <img class="rodape-qr" id="qr-mural" alt="QR code do Mural Interativo">
  </div>
  <div class="rodape-aviso">
    <span class="aviso-titulo">ATENÇÃO!</span>
    <span class="aviso-texto">NÃO tocar na tela da TV</span>
  </div>
</footer>
<div class="barra-tempo" id="barra-progresso"></div>
<div class="nav-buttons" id="nav-buttons">
  <button class="nav-btn" id="btn-prev" aria-label="Anterior">&lsaquo;</button>
  <button class="nav-btn" id="btn-next" aria-label="Proximo">&rsaquo;</button>
</div>
<div class="fullscreen-controls">
  <button class="fullscreen-btn" id="btn-fullscreen" type="button" aria-label="Entrar em tela cheia" title="Entrar em tela cheia">
    <i class="bi bi-fullscreen" aria-hidden="true"></i>
  </button>
  <div class="fullscreen-tip" id="fullscreen-tip"></div>
</div>
<div id="interaction-blocker" hidden></div>
<button class="interaction-lock-btn" id="btn-lock" type="button" aria-pressed="false" aria-label="Bloquear interacao" title="Bloquear interacao">
  <i class="bi bi-unlock" aria-hidden="true"></i>
</button>

  <script src="/js/tv.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
