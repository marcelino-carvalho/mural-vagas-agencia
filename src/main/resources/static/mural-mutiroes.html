<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mural de Mutirões</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f7a5f">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/logo-agencia-2026.png">
  <link rel="stylesheet" href="/css/mural-mutiroes.css">
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="hero-card">
      <div class="eyebrow">QR exclusivo do painel de mutirões</div>
      <h1 class="title">Mural de Mutirões</h1>
      <p class="subtitle">Consulte os processos do painel de mutirões. Toque em um card para abrir a leitura completa com empresa, local e informações.</p>
      <div class="hero-meta">
        <div class="meta-chip">
          <div>
            <div class="meta-label">Acesso</div>
            <div class="status" id="status">Validando acesso...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main id="content"></main>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="close" id="sheetClose">Fechar</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

  <script src="/js/mural-mutiroes.js"></script>
</body>
</html>
