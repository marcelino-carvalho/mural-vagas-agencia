# Porta do servidor HTTP
server.port=${PORT:8080}

# Configurações de Conexão com o Banco de Dados PostgreSQL (Neon / Produção / Local)
# Permite sobrescrever via variáveis de ambiente com fallbacks para os valores padrão atuais
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-round-glitter-ahm15y6t-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_RBdK5C6LkIfO}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Pool de Conexões HikariCP (otimizado para instâncias com recursos limitados)
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.maximum-pool-size=3

# Segurança e Validade de Tokens do Mural
mural.token.session-validity-minutes=${MURAL_TOKEN_SESSION_VALIDITY:15}
mural.token.qr-validity-minutes=${MURAL_TOKEN_QR_VALIDITY:120}
mural.token.bind-ip=${MURAL_TOKEN_BIND_IP:false}
mural.token.secret=${MURAL_TOKEN_SECRET:}

# Janela de Horário de Acesso ao Painel
panel.access.zone=${PANEL_ACCESS_ZONE:America/Sao_Paulo}
panel.access.start=${PANEL_ACCESS_START:07:10}
panel.access.end=${PANEL_ACCESS_END:17:10}

# Modo de Desenvolvimento/Testes Locais:
# Quando 'true', o mural fica SEMPRE ATIVO mesmo fora do horário comercial ou fins de semana.
# Em produção real, defina a variável de ambiente PANEL_ACCESS_FORCE_OPEN=false.
panel.access.force-open=${PANEL_ACCESS_FORCE_OPEN:true}
